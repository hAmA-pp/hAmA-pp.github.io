<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hAmA</title>
<meta name="description" content="hAmA의 작은 작업실">
<script>try{var t=localStorage.getItem("hama-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--surface:#f2f0eb;--tx:#22211f;--mut:#75726b;--faint:#a5a29a;--line:#e5e2db;--ac:#b4532a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151514;--surface:#1e1e1c;--tx:#e9e7e2;--mut:#9c998f;--faint:#6b6962;--line:#2c2b28;--ac:#e08a5f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151514;--surface:#1e1e1c;--tx:#e9e7e2;--mut:#9c998f;--faint:#6b6962;--line:#2c2b28;--ac:#e08a5f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  transition:background-color .2s,color .2s}
.wrap{max-width:640px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}
.logo{font-family:"Noto Serif KR",serif;font-weight:700;font-size:20px;color:var(--tx);text-decoration:none;letter-spacing:-.01em}
.logo span{color:var(--ac)}
.theme{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mut);cursor:pointer;transition:color .15s,border-color .15s}
.theme:hover{color:var(--tx);border-color:var(--faint)}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
.intro h1{font-family:"Noto Serif KR",serif;font-weight:700;font-size:30px;line-height:1.35;letter-spacing:-.02em;margin:0 0 12px}
.intro p{margin:0;color:var(--mut)}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--faint);margin:64px 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:22px 4px;color:inherit;text-decoration:none}
.meta{grid-column:1/-1;font-size:13px;color:var(--faint);display:flex;gap:8px;align-items:center}
.meta .tag{color:var(--ac);font-weight:600}
.title{font-family:"Noto Serif KR",serif;font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
.desc{grid-column:1;font-size:15px;color:var(--mut)}
.arrow{grid-column:2;grid-row:2/4;color:var(--faint);font-size:20px;transition:transform .18s,color .18s}
a.item:hover .title{color:var(--ac)}
a.item:hover .arrow{transform:translateX(4px);color:var(--ac)}
a.item:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
.item.soon{cursor:default}
.item.soon .title,.item.soon .desc{color:var(--faint)}
.badge{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut);background:var(--surface)}
footer{margin-top:72px;font-size:13px;color:var(--faint)}
@media (max-width:480px){
  header{margin-bottom:48px}
  .intro h1{font-size:25px}
  .title{font-size:19px}
  h2{margin-top:48px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="./">hAmA<span>.</span></a>
  <button class="theme" id="theme" type="button" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드 전환">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<section class="intro">
  <h1>기록하고, 점검하고,<br>조금씩 나아지는 곳</h1>
  <p>매일 쓰는 작은 도구들을 모아두었습니다.</p>
</section>

<h2>TOOLS</h2>
<ul class="list">
  <li>
    <a class="item" href="tqqq/">
      <span class="meta"><span class="tag">투자</span><span>·</span><span>사용 중</span></span>
      <span class="title">TQQQ 무한매수</span>
      <span class="desc">무한매수법 주문 계산 · 토스 자동 주문 · 체결 이력</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </li>
  <li>
    <div class="item soon" aria-disabled="true">
      <span class="meta"><span class="tag">생활</span><span>·</span><span class="badge">준비 중</span></span>
      <span class="title">플랜</span>
      <span class="desc">연간계획 점검과 가계부</span>
    </div>
  </li>
</ul>

<footer>© <span id="yr">2026</span> hAmA</footer>
</div>
<script>
(function(){
  document.getElementById("yr").textContent=new Date().getFullYear();
  var root=document.documentElement;
  function current(){
    var t=root.getAttribute("data-theme");
    if(t==="light"||t==="dark")return t;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  document.getElementById("theme").addEventListener("click",function(){
    var next=current()==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("hama-theme",next)}catch(e){}
  });
})();
</script>
</body>
</html>
